# Adds an HTTPS reverse proxy in front of the backend. Use together with the main file:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build backend caddy
# (the frontend is deployed on Vercel, so it is not started here)
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env, for example api-yourname.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
